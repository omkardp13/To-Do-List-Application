<div *ngIf="!showTaskForm && userAccount.currentUser()" class="container mt-4">
  <div class="container mt-5 mb-5">
  <!-- Filter and Search -->
  <div class="d-flex justify-content-center align-items-center mb-4">
    <label class="col-form-label me-2">Show:</label>
    <select
      [(ngModel)]="selectedFilter"
      (change)="applyFilters()"
      class="form-select"
      style="width: 130px;"
    >
      <option value="completed">Completed Tasks</option>
      <option value="pending">Pending Tasks</option>
      <option value="all">All Tasks</option>
    </select>
    <button
      (click)="resetFilters()"
      class="btn btn-info ms-3"
      type="button"
    >
      Reset Filters
    </button>
  </div>

  <div class="d-flex justify-content-center align-items-center">
    <input
      [(ngModel)]="searchQuery"
      (input)="applyFilters()"
      class="form-control"
      placeholder="Search by title"
      style="width: 300px;"
    />
  </div>

  <!-- Task Lists -->
 
    <!-- Tasks -->
    <div>
      <h2 class="text-center text-secondary">
        {{ selectedFilter === 'completed' ? 'Completed Tasks' : selectedFilter === 'pending' ? 'Pending Tasks' : 'All Tasks' }}
      </h2>
      <ul *ngIf="paginatedTasks.length > 0" class="list-group">
        <li *ngFor="let task of paginatedTasks" class="list-group-item d-flex justify-content-between">
          <span>{{ task.title }}</span>
          <div>
            <button (click)="editTask(task)" class="btn btn-sm btn-info me-2">Edit</button>
            <button (click)="deleteTask(task.taskId)" class="btn btn-sm btn-danger">Delete</button>
          </div>
        </li>
      </ul>
      <p *ngIf="paginatedTasks.length === 0" class="text-center text-muted">No tasks found.</p>
    </div>

    <div class="text-center mt-4">
      <button (click)="addNewTask()" class="btn btn-info">Add Task</button>
    <!-- Pagination Controls -->
    <div class="d-flex justify-content-center align-items-center mt-4">
      <button
        (click)="changePage(currentPage - 1)"
        [disabled]="currentPage === 1"
        class="btn btn-outline-info me-2"
      >
        Previous
      </button>
      <span>Page {{ currentPage }} of {{ getTotalPages() }}</span>
      <button
        (click)="changePage(currentPage + 1)"
        [disabled]="currentPage === getTotalPages()"
        class="btn btn-outline-info ms-2"
      >
        Next
      </button>
    </div>
  </div>
   <!-- Task Form -->
   
</div>
</div>
<div *ngIf="showTaskForm" class="mt-4">
  <app-task-form [task]="selectedTask" (save)="onSaveTask($event)"></app-task-form>
</div>
